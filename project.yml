# XcodeGen spec. Generate the Xcode project with:
#   brew install xcodegen
#   xcodegen generate
#   open PocketInstrument.xcodeproj
name: PocketInstrument
options:
  bundleIdPrefix: com.studio4
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # Matches the Xcode that last upgraded the project, so regenerating doesn't undo its settings.
  xcodeVersion: "26.3"

packages:
  EditCore:
    path: Packages/EditCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "6"
    STRING_CATALOG_GENERATE_SYMBOLS: YES

targets:
  PocketInstrument:
    type: application
    platform: iOS
    sources:
      - path: PocketInstrument
    dependencies:
      - package: EditCore
    scheme:
      testTargets:
        - PocketInstrumentTests
        - PocketInstrumentUITests
    preBuildScripts:
      # Reports swift-format issues as Xcode warnings; never fails the build.
      # Rules live in .swift-format at the repo root.
      - name: swift-format lint
        basedOnDependencyAnalysis: false
        script: |
          if xcrun --find swift-format >/dev/null 2>&1; then
            # swift-format prints cwd-relative paths; make them absolute so Xcode can jump to them.
            cd "$SRCROOT"
            xcrun swift-format lint -r PocketInstrument PocketInstrumentTests PocketInstrumentUITests Packages 2>&1 \
              | sed -E "s|^([^/][^:]*\.swift:)|$SRCROOT/\1|"
          else
            echo "warning: swift-format not found; install Xcode 16 or later to lint."
          fi
    info:
      path: PocketInstrument/Info.plist
      properties:
        CFBundleDisplayName: CINE SLICE
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.video
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIUserInterfaceStyle: Dark
        NSPhotoLibraryAddUsageDescription: CineSlice saves your finished exports to Photos.
        # No encryption beyond what iOS itself provides, so uploads skip the export-compliance question.
        ITSAppUsesNonExemptEncryption: false
        # Only to show "Open Instagram" after saving, when Instagram is installed.
        LSApplicationQueriesSchemes:
          - instagram
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.studio4.cineslice
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # The lint script reads the whole source tree, which the script sandbox would block.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # The signing team (Xcode: Signing & Capabilities).
        DEVELOPMENT_TEAM: HF6H3Q6CJ2

  # Media pipeline tests (AVFoundation), hosted in the app on the Simulator:
  #   xcodebuild test -scheme PocketInstrument -destination 'platform=iOS Simulator,name=iPhone 17 Pro'
  PocketInstrumentTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PocketInstrumentTests
    dependencies:
      - target: PocketInstrument
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.studio4.cineslice.tests
        DEVELOPMENT_TEAM: HF6H3Q6CJ2

  # Taps through the workspace states and attaches a screenshot of each (layout check).
  PocketInstrumentUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PocketInstrumentUITests
    dependencies:
      - target: PocketInstrument
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.studio4.cineslice.uitests
        DEVELOPMENT_TEAM: HF6H3Q6CJ2

# Core logic tests run without Xcode: cd Packages/EditCore && swift test
